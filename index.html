<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Alarm App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h2 id="appTitle">Smart Alarm App</h2>

    <div id="soundActivationBanner">
        ⚠️ Tap below to enable alarm sound!
        <br>
        <button onclick="enableSound()">🔔 Enable Alarm Sound</button>
    </div>

    <div class="nav-bar">
        <button onclick="switchTab('alarm')" id="btnAlarm" class="active">Alarm</button>
        <button onclick="switchTab('clock')" id="btnClock">Clock</button>
        <button onclick="switchTab('stopwatch')" id="btnStopwatch">Stopwatch</button>
        <button onclick="switchTab('timer')" id="btnTimer">Timer</button>
        <button onclick="switchTab('settings')" id="btnSettings">Settings</button>
    </div>

    <div id="alarmSection" class="section active">
        <h3 id="lblSetAlarm">Set Alarm</h3>
        <input type="time" id="alarmTime">
        <label id="lblSelectRingtone">Select Ringtone:</label>
        <select id="ringtoneSelect">
            <option value="default">Default Beep</option>
            <option value="bell">Classic Bell</option>
        </select>
        <button type="button" onclick="testSound()" class="btn-main" style="background: #2196F3;">🔊 Test Sound</button>
        <div class="days-container">
            <label><input type="checkbox" class="alarm-day" value="0"> Su</label>
            <label><input type="checkbox" class="alarm-day" value="1"> Mo</label>
            <label><input type="checkbox" class="alarm-day" value="2"> Tu</label>
            <label><input type="checkbox" class="alarm-day" value="3"> We</label>
            <label><input type="checkbox" class="alarm-day" value="4"> Th</label>
            <label><input type="checkbox" class="alarm-day" value="5"> Fr</label>
            <label><input type="checkbox" class="alarm-day" value="6"> Sa</label>
        </div>
        <button class="btn-main" onclick="setAlarm()" id="btnAddAlarmBtn">Add Alarm</button>
        <h4 id="lblActiveAlarms">Active Alarms:</h4>
        <ul id="alarmList"></ul>
    </div>

    <div id="clockSection" class="section">
        <h3 id="lblClockDisplay">Clock Display</h3>
        <div id="digitalDisplay" class="clock-container">00:00:00 AM</div>
    </div>

    <div id="stopwatchSection" class="section">
        <h3 id="lblStopwatch">Stopwatch</h3>
        <div class="clock-container" id="swDisplay">00:00:00</div>
        <button class="btn-main" onclick="startStopwatch()" id="btnSwStart">Start</button>
        <button class="btn-main" onclick="resetStopwatch()" style="background:#f44336;">Reset</button>
    </div>

    <div id="timerSection" class="section">
        <h3 id="lblTimer">Timer</h3>
        <input type="number" id="timerSeconds" placeholder="Enter seconds">
        <button class="btn-main" onclick="startTimer()" id="btnTimerStart">Start Timer</button>
        <div class="clock-container" id="timerDisplay">00:00</div>
    </div>

    <div id="settingsSection" class="section">
        <h3 id="lblSettings">Settings</h3>
        <select id="langSelect" onchange="changeLanguage()">
            <option value="en">English</option>
            <option value="bn">বাংলা</option>
        </select>
    </div>

    <div id="mathModal">
        <div class="math-content">
            <h3 id="lblRinging">🚨 ALARM RINGING! 🚨</h3>
            <p id="mathQuestion"></p>
            <input type="number" id="mathAnswer" placeholder="Answer">
            <button class="btn-main" onclick="checkMathAnswer()" id="btnSubmit">Submit</button>
        </div>
    </div>

    <audio id="alarmAudio" loop>
        <source src="https://actions.google.com/sounds/v1/alarms/digital_watch_alarm_long.ogg" type="audio/ogg">
    </audio>

    <script src="script.js"></script>
</body>
</html>
